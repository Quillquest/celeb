name: CI

on:
  push:
    branches: [ main, upgrade/laravel-11 ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.2', '8.3', '8.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, curl

      - name: Validate composer.json
        run: composer validate --no-check-all

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --no-interaction

      - name: PHP lint
        run: find app config routes database tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: php -d error_reporting='E_ALL & ~E_DEPRECATED' ./vendor/bin/phpunit --configuration phpunit.xml --stderr
